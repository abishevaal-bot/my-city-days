name: Build My City Days

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o my_city_days_fixed.zip -d project

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get packages
        working-directory: project/my_city_days_fixed
        run: flutter pub get

      - name: Build web
        working-directory: project/my_city_days_fixed
        run: flutter build web
