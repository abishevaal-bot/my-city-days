workflows:
  ios-testflight:
    name: My City Days TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: "My City Days"

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        provisioning_profiles:
          - MyCityDaysAppStore
        certificates:
          - MyCityDaysDistribution

    scripts:
      - name: Unpack My City Days MVP
        script: |
          rm -rf project
          mkdir -p project
          unzip -o my_city_days_build_4_iap_paywall.zip -d project

      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

          cd project/my_city_days_fixed

          python3 - <<'PY'
          from pathlib import Path
          import re

          pubspec = Path("pubspec.yaml")
          text = pubspec.read_text()

          if re.search(r'^\s+enable-swift-package-manager\s*:', text, flags=re.M):
              text = re.sub(
                  r'^(\s+)enable-swift-package-manager\s*:\s*.*$',
                  r'\1enable-swift-package-manager: false',
                  text,
                  flags=re.M
              )
          else:
              lines = text.splitlines()

              flutter_index = None
              for i, line in enumerate(lines):
                  if line.strip() == "flutter:" and not line.startswith(" "):
                      flutter_index = i
                      break

              if flutter_index is None:
                  raise Exception("flutter: section not found in pubspec.yaml")

              section_end = len(lines)
              for i in range(flutter_index + 1, len(lines)):
                  line = lines[i]
                  if line and not line.startswith((" ", "\t", "#")):
                      section_end = i
                      break

              config_index = None
              for i in range(flutter_index + 1, section_end):
                  if lines[i].strip() == "config:":
                      config_index = i
                      break

              if config_index is not None:
                  lines.insert(
                      config_index + 1,
                      "    enable-swift-package-manager: false"
                  )
              else:
                  lines.insert(flutter_index + 1, "  config:")
                  lines.insert(
                      flutter_index + 2,
                      "    enable-swift-package-manager: false"
                  )

              text = "\n".join(lines) + "\n"

          pubspec.write_text(text)

          print("Swift Package Manager disabled in pubspec.yaml")
          PY

      - name: Configure iOS
        script: |
          cd project/my_city_days_fixed

          python3 - <<'PY'
          from pathlib import Path
          import re

          podfile = Path("ios/Podfile")
          text = podfile.read_text()

          if re.search(r'^\s*#?\s*platform\s+:ios', text, flags=re.M):
              text = re.sub(
                  r'^\s*#?\s*platform\s+:ios.*$',
                  "platform :ios, '15.0'",
                  text,
                  count=1,
                  flags=re.M
              )
          else:
              text = "platform :ios, '15.0'\n" + text

          podfile.write_text(text)

          pbx = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = pbx.read_text()

          text = re.sub(
              r'IPHONEOS_DEPLOYMENT_TARGET = [^;]+;',
              'IPHONEOS_DEPLOYMENT_TARGET = 15.0;',
              text
          )

          text = re.sub(
              r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;',
              'PRODUCT_BUNDLE_IDENTIFIER = com.abisheva.mycitydays;',
              text
          )

          pbx.write_text(text)

          print("iOS deployment target: 15.0")
          print("Bundle ID: com.abisheva.mycitydays")
          PY

      - name: Get Flutter packages
        script: |
          cd project/my_city_days_fixed
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd project/my_city_days_fixed/ios
          rm -rf Pods Podfile.lock
          pod install --repo-update

      - name: Set up code signing
        script: |
          cd project/my_city_days_fixed
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          cd project/my_city_days_fixed
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=3 \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - project/my_city_days_fixed/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
