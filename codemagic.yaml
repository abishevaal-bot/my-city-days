workflows:
  ios-unsigned-test:
    name: My City Days iOS Test
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Unpack My City Days MVP
        script: |
          rm -rf project
          mkdir -p project
          unzip -o my_city_days_mvp_1_0.zip -d project

      - name: Configure iOS
        script: |
          cd project/my_city_days_fixed

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Set minimum iOS version
          podfile = Path("ios/Podfile")
          text = podfile.read_text()

          if re.search(r'^\s*#?\s*platform\s+:ios', text, flags=re.M):
              text = re.sub(
                  r'^\s*#?\s*platform\s+:ios.*$',
                  "platform :ios, '15.0'",
                  text,
                  count=1,
                  flags=re.M
              )
          else:
              text = "platform :ios, '15.0'\n" + text

          podfile.write_text(text)

          # Set deployment target and correct Bundle ID
          pbx = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = pbx.read_text()

          text = re.sub(
              r'IPHONEOS_DEPLOYMENT_TARGET = [^;]+;',
              'IPHONEOS_DEPLOYMENT_TARGET = 15.0;',
              text
          )

          text = re.sub(
              r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;',
              'PRODUCT_BUNDLE_IDENTIFIER = com.abisheva.mycitydays;',
              text
          )

          pbx.write_text(text)

          print("iOS deployment target: 15.0")
          print("Bundle ID: com.abisheva.mycitydays")
          PY

      - name: Get Flutter packages
        script: |
          cd project/my_city_days_fixed
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd project/my_city_days_fixed/ios
          pod install

      - name: Build iOS without signing
        script: |
          cd project/my_city_days_fixed
          flutter build ios --debug --no-codesign

    artifacts:
      - project/my_city_days_fixed/build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log
