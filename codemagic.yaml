workflows:
  ios-unsigned-test:
    name: My City Days iOS Test
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Unpack My City Days MVP
        script: |
          rm -rf project
          mkdir -p project
          unzip -o my_city_days_mvp_1_0.zip -d project

      - name: Get Flutter packages
        script: |
          cd project/my_city_days_fixed
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd project/my_city_days_fixed
          find . -name "Podfile" -execdir pod install \;

      - name: Build iOS
        script: |
          cd project/my_city_days_fixed
          flutter build ios --debug --no-codesign

    artifacts:
      - project/my_city_days_fixed/build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log
